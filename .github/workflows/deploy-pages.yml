name: Deploy to GitHub Pages

# Builds the static Next.js export and publishes it to GitHub Pages.
# For project pages (https://<user>.github.io/<repo>/) NEXT_PUBLIC_BASE_PATH is
# derived from the repo name; for user/org pages it is left empty.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Grant the workflow the permissions GitHub Pages needs and an id-token so
# OIDC can authenticate deployments without a stored PAT.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment at a time.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        # Enables GitHub Pages (when not already enabled) and switches the
        # Pages source to GitHub Actions so deploy-pages can publish to it.
        uses: actions/configure-pages@v5

      - name: Configure GitHub Pages base path
        run: echo "NEXT_PUBLIC_BASE_PATH=/${{ github.event.repository.name }}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Static export is emitted to ./out by output: 'export'.
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
